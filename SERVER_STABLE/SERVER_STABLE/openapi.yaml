components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      description: >
        Opaque keyset cursor generated from the previous page using
        (created_at, id) or (enrolled_at, id) ordering.
      schema:
        type: string
      example: MjAyNi0wNC0yOFQwOTowMDowMFouMDAwWjo5MDAx
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    CourseIdParam:
      name: courseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: '9001'
    CategoryIdParam:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: '2001'
    TeacherIdParam:
      name: teacherId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: '3001'
  responses:
    BadRequest:
      description: Request body, path, or query parameter is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: bad_request
              message: Validation failed for query parameter limit.
              details:
                limit: must be less than or equal to 100
              request_id: req_7f3a0d2e
    Unauthorized:
      description: Missing, expired, or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Bearer token is missing or invalid.
              details: {}
              request_id: req_7f3a0d2e
    Forbidden:
      description: Authenticated user does not have the required role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: forbidden
              message: You do not have permission to perform this action.
              details:
                required_roles:
                  - admin
              request_id: req_7f3a0d2e
    NotFound:
      description: Requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: Course 9001 was not found.
              details: {}
              request_id: req_7f3a0d2e
    Conflict:
      description: Request conflicts with current system state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: conflict
              message: Student is already enrolled in this course.
              details:
                course_id: '9001'
              request_id: req_7f3a0d2e
    UnprocessableEntity:
      description: Request format is valid JSON but violates semantic validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unprocessable_entity
              message: Course cannot be published while required fields are missing.
              details:
                missing_fields:
                  - description
                  - capacity
              request_id: req_7f3a0d2e
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_server_error
              message: An unexpected error occurred.
              details: {}
              request_id: req_7f3a0d2e
  schemas:
    Id:
      type: string
      pattern: '^[0-9]+$'
      example: '9001'
    ReadinessCheck:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          example: true
        latency_ms:
          type: integer
          nullable: true
          example: 12
        skipped:
          type: boolean
          nullable: true
          example: false
        reason:
          type: string
          nullable: true
          example: background_workers_disabled
        error:
          type: string
          nullable: true
          example: Connection refused
    ReadinessResponse:
      type: object
      required:
        - ok
        - service
        - checked_at
        - checks
      properties:
        ok:
          type: boolean
          example: true
        service:
          type: string
          example: academy-api
        checked_at:
          type: string
          format: date-time
          example: '2026-05-13T10:00:00.000Z'
        checks:
          type: object
          required:
            - database
            - redis
          properties:
            database:
              $ref: '#/components/schemas/ReadinessCheck'
            redis:
              $ref: '#/components/schemas/ReadinessCheck'
    Role:
      type: string
      enum:
        - student
        - admin
      example: student
    CourseLevel:
      type: string
      enum:
        - beginner
        - intermediate
        - advanced
      example: beginner
    CourseStatus:
      type: string
      enum:
        - draft
        - published
        - archived
      example: published
    EnrollmentStatus:
      type: string
      enum:
        - active
        - cancelled
      example: active
    Error:
      type: object
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          example: conflict
        message:
          type: string
          example: Student is already enrolled in this course.
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
          example: req_7f3a0d2e
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    MutationSuccess:
      type: object
      required:
        - ok
        - message
      properties:
        ok:
          type: boolean
          example: true
        message:
          type: string
          example: Resource deleted successfully.
    PaginationMeta:
      type: object
      required:
        - limit
        - has_more
      properties:
        next_cursor:
          type: string
          nullable: true
          example: MjAyNi0wNC0yN1QxMTowMDowMFouMDAwWjo4OTk1
        limit:
          type: integer
          example: 20
        has_more:
          type: boolean
          example: true
    UserSummary:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
          example: student@academy.dev
        display_name:
          type: string
          nullable: true
          example: Ayan Sarsen
        role:
          $ref: '#/components/schemas/Role'
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-05T10:05:00Z'
        is_verified:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2026-04-28T09:00:00Z'
    EmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: student@academy.dev
    AccountTokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: 0mF6r1v0bQ5nnxG0JpX3cV2Fv6c2Z11h
    PasswordResetConfirmRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          example: G1cLxV3yTbr7JmI86h4itAbH6vxOZ6tr
        password:
          type: string
          minLength: 8
          example: NewStrongPass123
    EmailJobSummary:
      type: object
      properties:
        queued:
          type: boolean
          example: true
        job_id:
          type: string
          nullable: true
          example: '42'
        fallback:
          type: string
          nullable: true
          example: setImmediate
    RegistrationResponse:
      type: object
      required:
        - ok
        - verification_required
        - message
        - user
      properties:
        ok:
          type: boolean
          example: true
        verification_required:
          type: boolean
          example: true
        message:
          type: string
          example: Account created. Check your email to verify the account before logging in.
        user:
          $ref: '#/components/schemas/UserSummary'
        email_job:
          $ref: '#/components/schemas/EmailJobSummary'
    VerifiedAccountResponse:
      type: object
      required:
        - ok
        - message
        - user
      properties:
        ok:
          type: boolean
          example: true
        message:
          type: string
          example: Email verified successfully. You can now log in.
        user:
          $ref: '#/components/schemas/UserSummary'
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - role
      properties:
        email:
          type: string
          format: email
          example: student@academy.dev
        password:
          type: string
          minLength: 8
          example: StrongPass123
        role:
          type: string
          enum:
            - student
          description: Public registration only creates student accounts.
          example: student
        display_name:
          type: string
          maxLength: 120
          example: Ayan Sarsen
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@academy.dev
        password:
          type: string
          minLength: 8
          example: AdminPass123
    TokenRefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh.signature
    AuthResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - user
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.demo.signature
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh.signature
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/UserSummary'
    MeResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/UserSummary'
    UserMutationResponse:
      type: object
      required:
        - ok
        - message
        - data
      properties:
        ok:
          type: boolean
          example: true
        message:
          type: string
          example: Account profile updated. A confirmation email has been queued.
        data:
          $ref: '#/components/schemas/UserSummary'
        email_job:
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/EmailJobSummary'
    UserProfileUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
          maxLength: 120
          example: Ayan Sarsen
    PasswordChangeRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          maxLength: 4096
          example: StrongPass123
        new_password:
          type: string
          minLength: 8
          example: NewStrongPass123
    Category:
      type: object
      required:
        - id
        - slug
        - name
        - is_active
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        slug:
          type: string
          example: frontend
        name:
          type: string
          example: Frontend
        description:
          type: string
          nullable: true
          example: Courses focused on client-side web development.
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2026-04-20T09:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-04-22T09:00:00Z'
    CategoryCreateRequest:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
          example: frontend
        name:
          type: string
          example: Frontend
        description:
          type: string
          nullable: true
          example: Courses focused on client-side web development.
        is_active:
          type: boolean
          default: true
          example: true
    CategoryUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/CategoryCreateRequest'
    CategoryListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    Teacher:
      type: object
      required:
        - id
        - full_name
        - subject
        - rating
        - is_active
      properties:
        id:
          $ref: '#/components/schemas/Id'
        full_name:
          type: string
          example: Aigerim Tolegen
        subject:
          type: string
          example: Web Development
        rating:
          type: number
          format: float
          example: 4.9
        bio:
          type: string
          nullable: true
          example: Senior frontend engineer with 8 years of product experience.
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2026-04-10T09:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-04-25T09:00:00Z'
    TeacherCreateRequest:
      type: object
      required:
        - full_name
        - subject
        - rating
      properties:
        full_name:
          type: string
          example: Aigerim Tolegen
        subject:
          type: string
          example: Web Development
        rating:
          type: number
          format: float
          minimum: 1
          maximum: 5
          example: 4.9
        bio:
          type: string
          nullable: true
          example: Senior frontend engineer with 8 years of product experience.
        is_active:
          type: boolean
          default: true
