openapi: 3.0.3
info:
  title: Academy Portal API
  version: 1.0.0
  description: >
    Technical contract for the Academy Portal backend. The API supports public
    course discovery, student enrollments, and admin management of courses,
    teachers, and categories.
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Auth
  - name: Users
  - name: Courses
  - name: Categories
  - name: Teachers
  - name: Enrollments
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new account
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate a user and issue tokens
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/me:
    get:
      tags:
        - Users
      summary: Return the current authenticated user
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/courses:
    get:
      tags:
        - Courses
      summary: List courses with cursor pagination and filters
      operationId: listCourses
      security: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          example: react
        - name: category_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
          example: '2001'
        - name: teacher_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
          example: '3001'
        - name: level
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CourseLevel'
        - name: status
          in: query
          required: false
          description: Admin-only filter; ignored for guests and students.
          schema:
            $ref: '#/components/schemas/CourseStatus'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - -created_at
              - created_at
          example: -created_at
      responses:
        '200':
          description: Paginated list of courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Courses
      summary: Create a new course draft
      operationId: createCourse
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreateRequest'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/courses/{courseId}:
    get:
      tags:
        - Courses
      summary: Get a single course by ID
      operationId: getCourseById
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseIdParam'
      responses:
        '200':
          description: Course detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Courses
      summary: Update an existing course
      operationId: updateCourse
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdateRequest'
      responses:
        '200':
          description: Updated course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Courses
      summary: Delete or archive a course
      operationId: deleteCourse
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdParam'
      responses:
        '200':
          description: Course deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/categories:
    get:
      tags:
        - Categories
      summary: List course categories
      operationId: listCategories
      security: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          example: frontend
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - name
              - -created_at
              - created_at
          example: name
      responses:
        '200':
          description: Paginated categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Categories
      summary: Create a category
      operationId: createCategory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/categories/{categoryId}:
    put:
      tags:
        - Categories
      summary: Update a category
      operationId: updateCategory
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Categories
      summary: Delete a category
      operationId: deleteCategory
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryIdParam'
      responses:
        '200':
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/teachers:
    get:
      tags:
        - Teachers
      summary: List teachers
      operationId: listTeachers
      security: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          example: aigerim
        - name: subject
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
          example: Web Development
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - name
              - -created_at
              - created_at
          example: name
      responses:
        '200':
          description: Paginated teachers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Teachers
      summary: Create a teacher profile
      operationId: createTeacher
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherCreateRequest'
      responses:
        '201':
          description: Teacher created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/teachers/{teacherId}:
    put:
      tags:
        - Teachers
      summary: Update a teacher profile
      operationId: updateTeacher
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeacherIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherUpdateRequest'
      responses:
        '200':
          description: Updated teacher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Teachers
      summary: Delete a teacher profile
      operationId: deleteTeacher
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeacherIdParam'
      responses:
        '200':
          description: Teacher deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/enrollments:
    get:
      tags:
        - Enrollments
      summary: List current student's enrollments
      operationId: listMyEnrollments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EnrollmentStatus'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - -enrolled_at
              - enrolled_at
          example: -enrolled_at
      responses:
        '200':
          description: Paginated enrollments for the current student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Enrollments
      summary: Enroll the current student in a course
      operationId: createEnrollment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCreateRequest'
      responses:
        '201':
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/enrollments/{courseId}:
    delete:
      tags:
        - Enrollments
      summary: Unenroll the current student from a course
      operationId: deleteEnrollment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdParam'
      responses:
        '200':
          description: Enrollment removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      description: >
        Opaque keyset cursor generated from the previous page using
        (created_at, id) or (enrolled_at, id) ordering.
      schema:
        type: string
      example: MjAyNi0wNC0yOFQwOTowMDowMFouMDAwWjo5MDAx
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    CourseIdParam:
      name: courseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: '9001'
    CategoryIdParam:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: '2001'
    TeacherIdParam:
      name: teacherId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: '3001'
  responses:
    BadRequest:
      description: Request body, path, or query parameter is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: bad_request
              message: Validation failed for query parameter limit.
              details:
                limit: must be less than or equal to 100
              request_id: req_7f3a0d2e
    Unauthorized:
      description: Missing, expired, or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Bearer token is missing or invalid.
              details: {}
              request_id: req_7f3a0d2e
    NotFound:
      description: Requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: Course 9001 was not found.
              details: {}
              request_id: req_7f3a0d2e
    Conflict:
      description: Request conflicts with current system state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: conflict
              message: Student is already enrolled in this course.
              details:
                course_id: '9001'
              request_id: req_7f3a0d2e
    UnprocessableEntity:
      description: Request format is valid JSON but violates semantic validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unprocessable_entity
              message: Course cannot be published while required fields are missing.
              details:
                missing_fields:
                  - description
                  - capacity
              request_id: req_7f3a0d2e
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_server_error
              message: An unexpected error occurred.
              details: {}
              request_id: req_7f3a0d2e
  schemas:
    Id:
      type: string
      pattern: '^[0-9]+$'
      example: '9001'
    Role:
      type: string
      enum:
        - student
        - admin
      example: student
    CourseLevel:
      type: string
      enum:
        - beginner
        - intermediate
        - advanced
      example: beginner
    CourseStatus:
      type: string
      enum:
        - draft
        - published
        - archived
      example: published
    EnrollmentStatus:
      type: string
      enum:
        - active
        - cancelled
      example: active
    Error:
      type: object
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          example: conflict
        message:
          type: string
          example: Student is already enrolled in this course.
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
          example: req_7f3a0d2e
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    MutationSuccess:
      type: object
      required:
        - ok
        - message
      properties:
        ok:
          type: boolean
          example: true
        message:
          type: string
          example: Resource deleted successfully.
    PaginationMeta:
      type: object
      required:
        - limit
        - has_more
      properties:
        next_cursor:
          type: string
          nullable: true
          example: MjAyNi0wNC0yN1QxMTowMDowMFouMDAwWjo4OTk1
        limit:
          type: integer
          example: 20
        has_more:
          type: boolean
          example: true
    UserSummary:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
          example: student@academy.dev
        display_name:
          type: string
          nullable: true
          example: Ayan Sarsen
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time
          example: '2026-04-28T09:00:00Z'
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - role
      properties:
        email:
          type: string
          format: email
          example: student@academy.dev
        password:
          type: string
          minLength: 8
          example: StrongPass123
        role:
          $ref: '#/components/schemas/Role'
        display_name:
          type: string
          maxLength: 120
          example: Ayan Sarsen
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@academy.dev
        password:
          type: string
          minLength: 8
          example: AdminPass123
    AuthResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - user
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.demo.signature
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
