# Local full stack (rubric): backend + worker + frontend + PostgreSQL 15 + Redis.
# Run: docker compose -f docker-compose.full.yml up --build
# DeployRocks must NOT use this file — use compose.deployrocks.yaml or root Dockerfile.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: academy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - academy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d academy_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.compose
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: 3000
      BACKEND_PORT: 3000
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/academy_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-access-secret-change-for-production-32chars}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-local-refresh-secret-change-for-production-32chars}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-Academy Portal <no-reply@localhost>}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_LOG_PATH: ${EMAIL_LOG_PATH:-email.out.log}
      SMTP_HOST: ${SMTP_HOST:-smtp.sendgrid.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-apikey}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      ENABLE_BACKGROUND_WORKERS: ${ENABLE_BACKGROUND_WORKERS:-true}
      START_WORKERS_IN_API: 'false'
      ENABLE_DAILY_STATS_JOB: ${ENABLE_DAILY_STATS_JOB:-true}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES:-1440}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      EMAIL_QUEUE_NAME: ${EMAIL_QUEUE_NAME:-academy-email}
      MAINTENANCE_QUEUE_NAME: ${MAINTENANCE_QUEUE_NAME:-academy-maintenance}
      STATS_JOB_REPEAT_MS: ${STATS_JOB_REPEAT_MS:-900000}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@academy.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPass123!}
      ADMIN_NAME: ${ADMIN_NAME:-Academy Admin}
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '--input-type=module',
          '-e',
          "const r=await fetch('http://127.0.0.1:3000/health');process.exit(r.ok?0:1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    command: >
      sh -c "npm run prisma:deploy &&
             npm run seed:admin &&
             npm run seed:demo &&
             node src/index.js"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.compose
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/academy_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-access-secret-change-for-production-32chars}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-local-refresh-secret-change-for-production-32chars}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-Academy Portal <no-reply@localhost>}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_LOG_PATH: ${EMAIL_LOG_PATH:-email.out.log}
      SMTP_HOST: ${SMTP_HOST:-smtp.sendgrid.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-apikey}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      ENABLE_BACKGROUND_WORKERS: 'true'
      START_WORKERS_IN_API: 'false'
      ENABLE_DAILY_STATS_JOB: ${ENABLE_DAILY_STATS_JOB:-true}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES:-1440}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      EMAIL_QUEUE_NAME: ${EMAIL_QUEUE_NAME:-academy-email}
      MAINTENANCE_QUEUE_NAME: ${MAINTENANCE_QUEUE_NAME:-academy-maintenance}
      STATS_JOB_REPEAT_MS: ${STATS_JOB_REPEAT_MS:-900000}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
    command: node src/worker.js

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.compose
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_HOST: api
      API_PORT: 3000
      PORT: 80
    ports:
      - '${FRONTEND_PORT:-8080}:80'

volumes:
  academy-postgres:
