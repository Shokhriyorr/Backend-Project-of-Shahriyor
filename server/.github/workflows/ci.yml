name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: academy_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academy_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:1234@localhost:5432/academy_db
      JWT_SECRET: ci-jwt-secret-string-with-at-least-32-characters
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_DAYS: 30
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ENABLE_DAILY_STATS_JOB: false
      ENABLE_BACKGROUND_WORKERS: false
      EMAIL_PROVIDER: log
      EMAIL_FROM: Academy Portal <ci@example.com>

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Docker build
        run: docker build -t academy-portal-api .
