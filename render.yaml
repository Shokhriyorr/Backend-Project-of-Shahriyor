# Render.com fallback if DeployRocks keeps failing.
# Create a Blueprint from this repo and set the same env vars as deployrocks.env.example

services:
  - type: web
    name: academy-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile.compose
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 5000
      - key: START_WORKERS_IN_API
        value: 'true'
      - key: ENABLE_BACKGROUND_WORKERS
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: academy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: academy-redis
          type: redis
          property: connectionString

  - type: web
    name: academy-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile.compose
    dockerContext: frontend
    plan: free

databases:
  - name: academy-db
    plan: free
    databaseName: academy_db
    user: postgres
